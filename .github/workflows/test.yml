name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Lint the example reports
        run: |
          PYTHONPATH=src python -m benchlint.cli lint examples/report_clean.json
          PYTHONPATH=src python -m benchlint.cli reliab examples/items.csv
